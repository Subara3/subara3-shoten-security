# すばら３商店の点検後ルールを nginx で書くとこうなる（Apache の .htaccess と同じ狙い）。
# php-fpm に渡す前提。server ブロックとして置くか、既存の server に location を移植する。
# 自分のサイトで使うときは、server_name・root・allow のIP・fastcgi_pass を合わせる。

server {
    listen 80;
    server_name shop.example.com;
    root /var/www/html;
    index index.php;

    server_tokens off;            # nginx の版を隠す（Apache の ServerTokens 相当）
    autoindex off;                # ディレクトリ一覧を出さない（Options -Indexes 相当）

    # ドットで始まるファイル（.env、.htaccess など）は返さない
    location ~ /\.          { deny all; }
    # 控え・ダンプ・ログの類は返さない（末尾 ~ のエディタ控えも）
    location ~* \.(bak|old|orig|sql|gz|zip|tar|log|env)$ { deny all; }
    location ~ ~$           { deny all; }
    # phpinfo を置いても外から開けない
    location = /phpinfo.php { deny all; }

    # 管理画面は店の回線だけ。^~ で、この下は正規表現 location より先に確定させる
    location ^~ /admin/ {
        allow 192.0.2.10;
        deny all;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;   # PHPの版を隠す
        }
    }

    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;       # PHPの版を隠す
    }
}
